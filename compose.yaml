services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social-connect

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - POSTGRES_PRISMA_URL=postgresql://postgres:postgres@db:5432/social-connect
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_CHAT_SERVICE_URL=http://localhost:3001
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - POSTGRES_PRISMA_URL=postgresql://postgres:postgres@db:5432/social-connect
      - PORT=3001
    command: yarn dev
    depends_on:
      - db
    volumes:
      - ./chat-service:/app/chat-service
      - /app/chat-service/node_modules

volumes:
  db_data: